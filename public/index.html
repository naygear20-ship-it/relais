<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relais · Messages programmés pour vos groupes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe6;--card:#fffdf8;--ink:#1b2320;--mut:#6a7570;--line:#e2dccd;--acc:#0e6b4e;--soft:#e2f0e8;--bad:#b3412e;--r:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Manrope,system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;letter-spacing:-.01em}
header{max-width:1180px;margin:auto;padding:28px 20px 8px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
h1{font-size:clamp(26px,4vw,38px);font-weight:700;line-height:1.1;max-width:15em}
.pill{display:flex;gap:8px;align-items:center;padding:7px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:#c9a227}.ready .dot{background:var(--acc);box-shadow:0 0 0 4px var(--soft)}.disconnected .dot{background:var(--bad)}
main{max-width:1180px;margin:auto;padding:16px 20px 56px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
h2{font-size:21px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px}
button:hover{border-color:var(--acc)}.pri{background:var(--acc);border-color:var(--acc);color:#fff}.pri:hover{filter:brightness(1.1)}
.ghost{border:0;background:none;color:var(--mut);padding:6px 8px}.danger:hover{color:var(--bad)}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.search{margin-bottom:12px}.list{display:flex;flex-direction:column;max-height:520px;overflow:auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 4px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}.mut{color:var(--mut);font-size:13px}
.sch{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;background:#fff}
.sch.off{opacity:.55}.sch h3{font-size:18px}.msg{margin:8px 0;padding:10px 12px;background:var(--soft);border-radius:12px;white-space:pre-wrap;max-height:96px;overflow:hidden}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.qr{text-align:center;max-width:460px;margin:24px auto}.qr img{width:min(320px,80vw);border-radius:12px;border:1px solid var(--line);padding:8px;background:#fff}
.qr ol{text-align:left;color:var(--mut);padding-left:20px}
dialog{border:0;border-radius:var(--r);padding:26px;width:min(520px,94vw);background:var(--card);color:var(--ink);box-shadow:0 30px 80px #0004}
.pick{max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff;padding:6px 10px}
.pick .ck{display:flex;gap:10px;align-items:center;margin:0;padding:6px 0;font-weight:500;font-size:15px;cursor:pointer}.pick input{width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chips span{background:var(--bg);border-radius:99px;padding:2px 10px;font-size:13px}
dialog::backdrop{background:#1b232066}label{display:block;font-weight:700;font-size:13px;margin:14px 0 5px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}.seg button.on{background:var(--soft);border-color:var(--acc);color:var(--acc)}
.days{display:flex;gap:6px;flex-wrap:wrap}.days button{padding:6px 11px}.days button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.log{font-size:13px;display:flex;gap:10px;padding:5px 0}.log b{color:var(--acc)}.log.bad b{color:var(--bad)}
.tg{width:42px;height:24px;border-radius:99px;background:#cfc8b6;position:relative;border:0;padding:0}.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--acc)}.tg.on::after{left:21px}
[hidden]{display:none!important}
#shotbtn{position:fixed;right:20px;bottom:20px;width:56px;height:56px;border-radius:50%;padding:0;display:grid;place-items:center;background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 10px 30px #0e6b4e66;z-index:50}
#shotbtn:hover{filter:brightness(1.1)}#shotbtn.busy{opacity:.55;pointer-events:none}
#shotpop{position:fixed;right:20px;bottom:88px;width:190px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px #0003;z-index:50;cursor:zoom-in}
#shotpop img{width:100%;display:block;border-radius:9px;border:1px solid var(--line)}
#shotpop button{position:absolute;top:-11px;right:-11px;width:26px;height:26px;border-radius:50%;padding:0;line-height:1}
#shotpop span{display:block;font-size:12px;color:var(--mut);padding:4px 2px 0}
#shotbig{position:fixed;inset:0;background:#141a18d9;display:grid;place-items:center;z-index:60;cursor:zoom-out;padding:3vh 3vw}
#shotbig img{max-width:94vw;max-height:84vh;border-radius:12px;box-shadow:0 30px 80px #000a;background:#fff}
#shotbig a{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--ink);padding:9px 18px;border-radius:12px;font-weight:700;text-decoration:none}
#shottools{position:fixed;top:16px;right:16px;display:flex;gap:8px;z-index:61}
#keypanel{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:min(760px,94vw);padding:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px #0005;z-index:61}
#keypanel .keys{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
#keypanel .keys button{padding:6px 10px}
#keypanel .type-row{display:flex;gap:8px}
#keypanel .type-row input{flex:1;min-width:0}
#keypanel .hint{margin:0;font-size:12px;color:var(--mut)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><h1>Vos groupes WhatsApp, des messages à l'heure dite.</h1><div class="acts"><div class="pill" id="pill"><span class="dot"></span><span id="st">Démarrage…</span></div><button id="logout" hidden onclick="logout()">Déconnexion</button></div></header>
<main id="app"></main>
<dialog id="dlg"><h2 id="dt">Nouvelle programmation</h2>
<label>Nom de l'ensemble</label><input id="fn" placeholder="Ex. Promos du matin">
<label>Groupes <span class="mut" id="cnt"></span></label><div class="pick" id="fg"></div>
<label>Message</label><textarea id="fm" rows="5" placeholder="Votre message…"></textarea>
<label>Rythme</label><div class="seg"><button data-m="daily">À heure fixe</button><button data-m="interval">À intervalle</button></div>
<div id="bd"><label>Heure</label><input type="time" id="ft" value="09:00"><label>Jours</label><div class="days" id="fd"></div></div>
<div id="bi" hidden><label>Toutes les (minutes, 5 minimum)</label><input type="number" id="fe" min="5" value="60"></div>
<div class="acts" style="margin-top:22px"><span class="sp"></span><button onclick="dlg.close()">Annuler</button><button class="pri" onclick="saveS()">Enregistrer</button></div></dialog>
<button id="shotbtn" title="Capturer la page" aria-label="Capturer la page"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h1.5l1.2-2h6.6l1.2 2H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
<div id="shotpop" hidden title="Agrandir"><img id="shotimg" alt="Dernière capture"><button id="shotx" aria-label="Fermer">×</button><span id="shottime"></span></div>
<div id="shotbig" hidden>
  <div id="shottools"><button id="shotrefresh">Actualiser la capture</button><button id="keytoggle">Clavier virtuel</button><button id="shotclose">Fermer</button></div>
  <img id="shotbigimg" alt="Capture WhatsApp agrandie">
  <a id="shotdl" download="capture-whatsapp.png">Télécharger</a>
  <section id="keypanel" hidden aria-label="Clavier virtuel">
    <p class="hint">Ces commandes agissent uniquement dans WhatsApp Web. Entrée peut envoyer le message actuellement saisi.</p>
    <div class="keys">
      <button data-key="Escape">Échap</button><button data-key="Tab">Tab</button><button data-key="ArrowUp">↑</button><button data-key="ArrowDown">↓</button><button data-key="ArrowLeft">←</button><button data-key="ArrowRight">→</button><button data-key="Home">Début</button><button data-key="End">Fin</button><button data-key="PageUp">Page ↑</button><button data-key="PageDown">Page ↓</button><button data-key="Backspace">Effacer</button><button data-key="Delete">Suppr.</button><button data-key="Space">Espace</button><button data-key="Enter">Entrée</button>
    </div>
    <div class="type-row"><input id="keytext" maxlength="500" placeholder="Texte à saisir dans le champ actif de WhatsApp"><button id="keysend" class="pri">Saisir</button></div>
    <p id="keyerror" class="hint" role="status"></p>
  </section>
</div>
<script>
const $=s=>document.querySelector(s),J=['D','L','M','M','J','V','S'],JN=['dim','lun','mar','mer','jeu','ven','sam'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=(u,m='GET',b)=>fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b&&JSON.stringify(b)}).then(r=>r.json());
let sel=new Set(),S={state:'starting'},G=[],SC=[],L=[],q='',edit=null,mode='daily',days=[0,1,2,3,4,5,6],built=false,auth={configured:false,authenticated:false},authError='';
const LBL={starting:'Démarrage…',qr:'En attente du scan',ready:'Connecté',disconnected:'Déconnecté, reconnexion…'};
async function tick(){
  try{[auth,S]=await Promise.all([api('/api/auth/status'),api('/api/status')])}
  catch(e){console.error(e);$('#pill').className='pill disconnected';$('#st').textContent='Serveur injoignable';return}
  $('#pill').className='pill '+S.state;$('#st').textContent=LBL[S.state]+(S.mock?' (démo)':'');
  $('#logout').hidden=!auth.authenticated;
  if(auth.authenticated&&S.state==='ready'){
    try{
      const [groups,schedules,logs]=await Promise.all([api('/api/groups'),api('/api/schedules'),api('/api/logs')]);
      if(Array.isArray(groups))G=groups;
      SC=schedules;L=logs;
    }catch(e){S.groupsError=`Erreur de communication avec le serveur : ${e.message}`;console.error(e)}
  }
  const enteringCredentials=!auth.authenticated&&document.activeElement&&document.activeElement.closest('#app form');
  if(!enteringCredentials&&!(document.activeElement&&document.activeElement.id==='q'))render();
}
function renderAuth(){
  built=false;
  const setup=!auth.configured;
  const waiting=setup&&S.state!=='ready';
  if(waiting){$('#app').innerHTML='';render();return}
  $('#app').innerHTML=`<section class="card qr"><h2>${setup?'Créer votre compte Relais':'Connexion à Relais'}</h2>
    <p class="mut">${setup?'WhatsApp est connecté. Créez votre compte pour protéger l’accès au tableau de bord.':'Connectez-vous pour accéder à vos groupes et programmations.'}</p>
    <form onsubmit="authSubmit(event)">
      ${setup?'<label>Code de vérification</label><input name="verificationCode" type="password" autocomplete="one-time-code" required><p class="mut">Code de vérification défini dans Sealos (ADMIN_PASSWORD, 20 caractères minimum).</p>':''}
      <label>Nom d’utilisateur</label><input name="username" autocomplete="username" minlength="3" maxlength="32" required>
      <label>Mot de passe</label><input name="password" type="password" autocomplete="${setup?'new-password':'current-password'}" minlength="${setup?12:1}" required>
      ${setup?'<p class="mut">Choisis un mot de passe d’au moins 12 caractères et conserve-le : il ne peut pas être récupéré.</p>':''}
      <p id="auth-error" class="mut" role="alert">${esc(authError)}</p>
      <button class="pri" type="submit">${setup?'Créer mon compte':'Se connecter'}</button>
    </form></section>`;
}
async function authSubmit(event){
  event.preventDefault();authError='';
  const form=new FormData(event.currentTarget),body=Object.fromEntries(form.entries());
  try{
    const result=await api(auth.configured?'/api/auth/login':'/api/auth/setup','POST',body);
    if(result.error){authError=result.error;$('#auth-error').textContent=authError;return}
    await tick();
  }catch(e){authError=`Erreur de communication : ${e.message}`;$('#auth-error').textContent=authError}
}
async function logout(){
  try{await api('/api/auth/logout','POST',{});auth={configured:true,authenticated:false};authError='';await tick()}
  catch(e){alert(`Déconnexion impossible : ${e.message}`)}
}
function summary(s){return s.mode==='interval'?`Toutes les ${s.everyMin} min`:`${s.time} · ${s.days.length===7?'chaque jour':s.days.map(d=>JN[d]).join(', ')}`}
function render(){
  const a=$('#app');
  if(!auth.authenticated&&auth.configured){renderAuth();return}
  if(!auth.authenticated&&S.state==='ready'){renderAuth();return}
  if(S.state!=='ready'){
    a.innerHTML=`<div class="card qr"><h2 style="justify-content:center">${S.qr?'Scannez pour connecter WhatsApp':'Préparation de la connexion…'}</h2>`+
    (S.qr?`<img src="${S.qr}" alt="QR code WhatsApp"><ol><li>Ouvrez WhatsApp sur votre téléphone</li><li>Réglages › Appareils connectés › Connecter un appareil</li><li>Scannez ce code (il se renouvelle tout seul)</li></ol>`:'<p class="mut">Le navigateur interne démarre, le QR code apparaît dans quelques secondes.</p>')+'</div>';built=false;return;}
  const f=G.filter(g=>g.name.toLowerCase().includes(q.toLowerCase()));
  if(!built){a.innerHTML=`<div class="grid"><section class="card"><h2>Groupes <button class="ghost" onclick="refresh()">Actualiser</button></h2><input id="q" class="search" placeholder="Rechercher un groupe…" oninput="q=this.value;lst()"><div class="list" id="gl"></div></section><section><div class="card"><h2>Ensembles programmés <button class="pri" onclick="openD()">Nouvelle</button></h2><div id="sl"></div></div><div class="card" style="margin-top:20px"><h2>Journal</h2><div id="lg"></div></div></section></div>`;built=true;}
  lst();
  $('#sl').innerHTML=SC.length?SC.map(s=>`<div class="sch ${s.enabled?'':'off'}"><div class="acts"><h3>${esc(s.name)}</h3><span class="sp"></span><button class="tg ${s.enabled?'on':''}" title="Activer / désactiver" onclick="tg('${s.id}',${!s.enabled})"></button></div><div class="mut">${summary(s)}</div><div class="chips">${s.groupNames.map(n=>`<span>${esc(n)}</span>`).join('')}</div><div class="msg">${esc(s.message)}</div><div class="acts"><button onclick="run('${s.id}')">Envoyer maintenant</button><button onclick="openD('${s.id}')">Modifier</button><span class="sp"></span><button class="ghost danger" onclick="del('${s.id}')">Supprimer</button></div></div>`).join(''):'<p class="mut">Aucun ensemble. Cochez des groupes, donnez-leur un message et un horaire.</p>';
  $('#lg').innerHTML=L.length?L.slice(0,12).map(l=>`<div class="log ${l.ok?'':'bad'}"><span class="mut">${new Date(l.t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</span><b>${l.ok?'✓':'✕'}</b><span>${esc(l.msg)}</span></div>`).join(''):'<p class="mut">Rien pour l\'instant.</p>';
}
function lst(){const f=G.filter(g=>g.name.toLowerCase().includes(q.toLowerCase()));
  const warning=G.length&&S.groupsError?`<p class="mut">${esc(S.groupsError)}</p>`:'';
  $('#gl').innerHTML=warning+(f.length?f.map(g=>`<div class="row"><div><b>${esc(g.name)}</b><div class="mut">${g.size} membres · ${SC.filter(s=>s.groupIds.includes(g.id)).length} programmation(s)</div></div><button onclick="openD(null,'${g.id}')">Programmer</button></div>`).join(''):G.length?'<p class="mut">Aucun groupe trouvé pour cette recherche.</p>':`<p class="mut">${esc(S.groupsError||'Synchronisation des discussions WhatsApp en cours…')}</p><button onclick="refresh()">Réessayer</button>`);}
async function refresh(){
  try{
    const r=await api('/api/groups?refresh=1');
    if(Array.isArray(r)){G=r;S.groupsError=null}
    else S.groupsError=r.error||'Le chargement des groupes a échoué.';
  }catch(e){S.groupsError=`Erreur de communication : ${e.message}`}
  lst();
}
function cnt(){$('#cnt').textContent=`(${sel.size} sélectionné${sel.size>1?'s':''})`}
const tp=id=>{sel.has(id)?sel.delete(id):sel.add(id);cnt()};
function setMode(m){mode=m;document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));$('#bd').hidden=m!=='daily';$('#bi').hidden=m!=='interval'}
function drawDays(){$('#fd').innerHTML=J.map((d,i)=>`<button class="${days.includes(i)?'on':''}" onclick="days=days.includes(${i})?days.filter(x=>x!==${i}):[...days,${i}];drawDays()">${d}</button>`).join('')}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
function openD(id=null,gid=null){edit=id;const s=SC.find(x=>x.id===id)||{};
  $('#dt').textContent=id?'Modifier l\'ensemble':'Nouvel ensemble de groupes';
  sel=new Set(s.groupIds||(gid?[gid]:[]));$('#fn').value=s.name||'';
  $('#fg').innerHTML=G.map(g=>`<label class="ck"><input type="checkbox" ${sel.has(g.id)?'checked':''} onchange="tp('${g.id}')"><span>${esc(g.name)}</span></label>`).join('');cnt();
  $('#fm').value=s.message||'';$('#ft').value=s.time||'09:00';$('#fe').value=s.everyMin||60;days=s.days||[0,1,2,3,4,5,6];drawDays();setMode(s.mode||'daily');dlg.showModal()}
async function saveS(){const b={name:$('#fn').value,groupIds:[...sel],message:$('#fm').value,mode,time:$('#ft').value,days,everyMin:$('#fe').value};
  const r=edit?await api('/api/schedules/'+edit,'PUT',b):await api('/api/schedules','POST',b);
  if(r.error)return alert(r.error);dlg.close();tick()}
const tg=async(id,v)=>{await api('/api/schedules/'+id,'PUT',{enabled:v});tick()};
const del=async id=>{if(confirm('Supprimer cet ensemble ?')){await api('/api/schedules/'+id,'DELETE');tick()}};
const run=async id=>{const r=await api('/api/schedules/'+id+'/run','POST');if(r.error)alert(r.error);tick()};
const sb=$('#shotbtn');
async function captureWhatsApp(){
  const r=await fetch('/api/screenshot',{cache:'no-store'});
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||`Erreur HTTP ${r.status}`)}
  const blob=await r.blob(),u=URL.createObjectURL(blob),ext=blob.type.includes('svg')?'svg':'png';
  if($('#shotimg').dataset.url)URL.revokeObjectURL($('#shotimg').dataset.url);
  $('#shotimg').dataset.url=u;$('#shotimg').src=u;$('#shotbigimg').src=u;$('#shotdl').href=u;$('#shotdl').download=`capture-whatsapp.${ext}`;
  $('#shottime').textContent='Capture de '+new Date().toLocaleTimeString('fr-FR');
}
sb.onclick=async()=>{
  sb.classList.add('busy');
  try{await captureWhatsApp();$('#shotpop').hidden=false}
  catch(e){alert('Capture impossible : '+e.message)}
  finally{sb.classList.remove('busy')}
};
$('#shotpop').onclick=()=>{$('#keypanel').hidden=true;$('#shotbig').hidden=false};
$('#shotx').onclick=e=>{e.stopPropagation();$('#shotpop').hidden=true};
$('#shotbig').onclick=e=>{if(e.target===$('#shotbig'))$('#shotbig').hidden=true};
$('#shotclose').onclick=()=>{$('#shotbig').hidden=true;$('#keypanel').hidden=true};
$('#keytoggle').onclick=()=>{$('#keypanel').hidden=!$('#keypanel').hidden;if(!$('#keypanel').hidden)$('#keytext').focus()};
$('#shotrefresh').onclick=async()=>{
  $('#shotrefresh').disabled=true;
  try{await captureWhatsApp()}catch(e){alert('Actualisation impossible : '+e.message)}
  finally{$('#shotrefresh').disabled=false}
};
async function sendBrowserInput(input){
  const r=await api('/api/browser/input','POST',input);
  if(r.error)throw new Error(r.error);
  await captureWhatsApp();
  $('#keyerror').textContent='Commande envoyée.';
}
document.querySelectorAll('#keypanel [data-key]').forEach(b=>b.onclick=async()=>{
  const key=b.dataset.key;
  if(key==='Enter'&&!confirm('La touche Entrée peut envoyer le message actuellement saisi dans WhatsApp. Continuer ?'))return;
  $('#keyerror').textContent='';
  try{await sendBrowserInput({key})}catch(e){$('#keyerror').textContent=e.message}
});
$('#keysend').onclick=async()=>{
  const input=$('#keytext'),text=input.value;
  if(!text)return;
  $('#keyerror').textContent='';
  try{await sendBrowserInput({text});input.value=''}catch(e){$('#keyerror').textContent=e.message}
};
$('#keytext').addEventListener('keydown',e=>{if(e.key==='Enter')e.preventDefault()});
addEventListener('keydown',e=>{if(e.key==='Escape'&& !$('#keypanel').contains(e.target)){$('#shotbig').hidden=true;$('#keypanel').hidden=true}});
tick();setInterval(tick,4000);
</script></body></html>
