<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relais · Messages programmés pour vos groupes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe6;--card:#fffdf8;--ink:#1b2320;--mut:#6a7570;--line:#e2dccd;--acc:#0e6b4e;--soft:#e2f0e8;--bad:#b3412e;--r:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Manrope,system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;letter-spacing:-.01em}
header{max-width:1180px;margin:auto;padding:28px 20px 8px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
h1{font-size:clamp(26px,4vw,38px);font-weight:700;line-height:1.1;max-width:15em}
.pill{display:flex;gap:8px;align-items:center;padding:7px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:#c9a227}.ready .dot{background:var(--acc);box-shadow:0 0 0 4px var(--soft)}.disconnected .dot{background:var(--bad)}
main{max-width:1180px;margin:auto;padding:16px 20px 56px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
h2{font-size:21px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px}
button:hover{border-color:var(--acc)}.pri{background:var(--acc);border-color:var(--acc);color:#fff}.pri:hover{filter:brightness(1.1)}
.ghost{border:0;background:none;color:var(--mut);padding:6px 8px}.danger:hover{color:var(--bad)}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.search{margin-bottom:12px}.list{display:flex;flex-direction:column;max-height:520px;overflow:auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 4px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}.mut{color:var(--mut);font-size:13px}
.sch{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;background:#fff}
.sch.off{opacity:.55}.sch h3{font-size:18px}.msg{margin:8px 0;padding:10px 12px;background:var(--soft);border-radius:12px;white-space:pre-wrap;max-height:96px;overflow:hidden}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.qr{text-align:center;max-width:460px;margin:24px auto}.qr img{width:min(320px,80vw);border-radius:12px;border:1px solid var(--line);padding:8px;background:#fff}
.qr ol{text-align:left;color:var(--mut);padding-left:20px}
dialog{border:0;border-radius:var(--r);padding:26px;width:min(520px,94vw);background:var(--card);color:var(--ink);box-shadow:0 30px 80px #0004}
.pick{max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff;padding:6px 10px}
.pick .ck{display:flex;gap:10px;align-items:center;margin:0;padding:6px 0;font-weight:500;font-size:15px;cursor:pointer}.pick input{width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chips span{background:var(--bg);border-radius:99px;padding:2px 10px;font-size:13px}
dialog::backdrop{background:#1b232066}label{display:block;font-weight:700;font-size:13px;margin:14px 0 5px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}.seg button.on{background:var(--soft);border-color:var(--acc);color:var(--acc)}
.days{display:flex;gap:6px;flex-wrap:wrap}.days button{padding:6px 11px}.days button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.log{font-size:13px;display:flex;gap:10px;padding:5px 0}.log b{color:var(--acc)}.log.bad b{color:var(--bad)}
.tg{width:42px;height:24px;border-radius:99px;background:#cfc8b6;position:relative;border:0;padding:0}.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--acc)}.tg.on::after{left:21px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><h1>Vos groupes WhatsApp, des messages à l'heure dite.</h1><div class="pill" id="pill"><span class="dot"></span><span id="st">Démarrage…</span></div></header>
<main id="app"></main>
<dialog id="dlg"><h2 id="dt">Nouvelle programmation</h2>
<label>Nom de l'ensemble</label><input id="fn" placeholder="Ex. Promos du matin">
<label>Groupes <span class="mut" id="cnt"></span></label><div class="pick" id="fg"></div>
<label>Message</label><textarea id="fm" rows="5" placeholder="Votre message…"></textarea>
<label>Rythme</label><div class="seg"><button data-m="daily">À heure fixe</button><button data-m="interval">À intervalle</button></div>
<div id="bd"><label>Heure</label><input type="time" id="ft" value="09:00"><label>Jours</label><div class="days" id="fd"></div></div>
<div id="bi" hidden><label>Toutes les (minutes, 5 minimum)</label><input type="number" id="fe" min="5" value="60"></div>
<div class="acts" style="margin-top:22px"><span class="sp"></span><button onclick="dlg.close()">Annuler</button><button class="pri" onclick="saveS()">Enregistrer</button></div></dialog>
<script>
const $=s=>document.querySelector(s),J=['D','L','M','M','J','V','S'],JN=['dim','lun','mar','mer','jeu','ven','sam'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=(u,m='GET',b)=>fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b&&JSON.stringify(b)}).then(r=>r.json());
let sel=new Set(),S={state:'starting'},G=[],SC=[],L=[],q='',edit=null,mode='daily',days=[0,1,2,3,4,5,6],built=false;
const LBL={starting:'Démarrage…',qr:'En attente du scan',ready:'Connecté',disconnected:'Déconnecté, reconnexion…'};
async function tick(){
  S=await api('/api/status');$('#pill').className='pill '+S.state;$('#st').textContent=LBL[S.state]+(S.mock?' (démo)':'');
  if(S.state==='ready'){[G,SC,L]=await Promise.all([api('/api/groups'),api('/api/schedules'),api('/api/logs')]);}
  if(!(document.activeElement&&document.activeElement.id==='q'))render();
}
function summary(s){return s.mode==='interval'?`Toutes les ${s.everyMin} min`:`${s.time} · ${s.days.length===7?'chaque jour':s.days.map(d=>JN[d]).join(', ')}`}
function render(){
  const a=$('#app');
  if(S.state!=='ready'){
    a.innerHTML=`<div class="card qr"><h2 style="justify-content:center">${S.qr?'Scannez pour connecter WhatsApp':'Préparation de la connexion…'}</h2>`+
    (S.qr?`<img src="${S.qr}" alt="QR code WhatsApp"><ol><li>Ouvrez WhatsApp sur votre téléphone</li><li>Réglages › Appareils connectés › Connecter un appareil</li><li>Scannez ce code (il se renouvelle tout seul)</li></ol>`:'<p class="mut">Le navigateur interne démarre, le QR code apparaît dans quelques secondes.</p>')+'</div>';built=false;return;}
  const f=G.filter(g=>g.name.toLowerCase().includes(q.toLowerCase()));
  if(!built){a.innerHTML=`<div class="grid"><section class="card"><h2>Groupes <button class="ghost" onclick="refresh()">Actualiser</button></h2><input id="q" class="search" placeholder="Rechercher un groupe…" oninput="q=this.value;lst()"><div class="list" id="gl"></div></section><section><div class="card"><h2>Ensembles programmés <button class="pri" onclick="openD()">Nouvelle</button></h2><div id="sl"></div></div><div class="card" style="margin-top:20px"><h2>Journal</h2><div id="lg"></div></div></section></div>`;built=true;}
  lst();
  $('#sl').innerHTML=SC.length?SC.map(s=>`<div class="sch ${s.enabled?'':'off'}"><div class="acts"><h3>${esc(s.name)}</h3><span class="sp"></span><button class="tg ${s.enabled?'on':''}" title="Activer / désactiver" onclick="tg('${s.id}',${!s.enabled})"></button></div><div class="mut">${summary(s)}</div><div class="chips">${s.groupNames.map(n=>`<span>${esc(n)}</span>`).join('')}</div><div class="msg">${esc(s.message)}</div><div class="acts"><button onclick="run('${s.id}')">Envoyer maintenant</button><button onclick="openD('${s.id}')">Modifier</button><span class="sp"></span><button class="ghost danger" onclick="del('${s.id}')">Supprimer</button></div></div>`).join(''):'<p class="mut">Aucun ensemble. Cochez des groupes, donnez-leur un message et un horaire.</p>';
  $('#lg').innerHTML=L.length?L.slice(0,12).map(l=>`<div class="log ${l.ok?'':'bad'}"><span class="mut">${new Date(l.t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</span><b>${l.ok?'✓':'✕'}</b><span>${esc(l.msg)}</span></div>`).join(''):'<p class="mut">Rien pour l\'instant.</p>';
}
function lst(){const f=G.filter(g=>g.name.toLowerCase().includes(q.toLowerCase()));
  $('#gl').innerHTML=f.length?f.map(g=>`<div class="row"><div><b>${esc(g.name)}</b><div class="mut">${g.size} membres · ${SC.filter(s=>s.groupIds.includes(g.id)).length} programmation(s)</div></div><button onclick="openD(null,'${g.id}')">Programmer</button></div>`).join(''):'<p class="mut">Aucun groupe trouvé.</p>';}
async function refresh(){G=await api('/api/groups?refresh=1');lst()}
function cnt(){$('#cnt').textContent=`(${sel.size} sélectionné${sel.size>1?'s':''})`}
const tp=id=>{sel.has(id)?sel.delete(id):sel.add(id);cnt()};
function setMode(m){mode=m;document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));$('#bd').hidden=m!=='daily';$('#bi').hidden=m!=='interval'}
function drawDays(){$('#fd').innerHTML=J.map((d,i)=>`<button class="${days.includes(i)?'on':''}" onclick="days=days.includes(${i})?days.filter(x=>x!==${i}):[...days,${i}];drawDays()">${d}</button>`).join('')}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
function openD(id=null,gid=null){edit=id;const s=SC.find(x=>x.id===id)||{};
  $('#dt').textContent=id?'Modifier l\'ensemble':'Nouvel ensemble de groupes';
  sel=new Set(s.groupIds||(gid?[gid]:[]));$('#fn').value=s.name||'';
  $('#fg').innerHTML=G.map(g=>`<label class="ck"><input type="checkbox" ${sel.has(g.id)?'checked':''} onchange="tp('${g.id}')"><span>${esc(g.name)}</span></label>`).join('');cnt();
  $('#fm').value=s.message||'';$('#ft').value=s.time||'09:00';$('#fe').value=s.everyMin||60;days=s.days||[0,1,2,3,4,5,6];drawDays();setMode(s.mode||'daily');dlg.showModal()}
async function saveS(){const b={name:$('#fn').value,groupIds:[...sel],message:$('#fm').value,mode,time:$('#ft').value,days,everyMin:$('#fe').value};
  const r=edit?await api('/api/schedules/'+edit,'PUT',b):await api('/api/schedules','POST',b);
  if(r.error)return alert(r.error);dlg.close();tick()}
const tg=async(id,v)=>{await api('/api/schedules/'+id,'PUT',{enabled:v});tick()};
const del=async id=>{if(confirm('Supprimer cet ensemble ?')){await api('/api/schedules/'+id,'DELETE');tick()}};
const run=async id=>{const r=await api('/api/schedules/'+id+'/run','POST');if(r.error)alert(r.error);tick()};
tick();setInterval(tick,4000);
</script></body></html>
